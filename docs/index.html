<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spellwright 로그라이트 프로젝트의 Live Design Dashboard" />
  <title>Spellwright — Design Dashboard</title>
  <link rel="canonical" href="https://hix4123.github.io/spellwright/" />
  <script>
    (() => {
      const saved = localStorage.getItem('spellwright-theme');
      const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', saved || preferred);

      const sidebarState = localStorage.getItem('spellwright-sidebar');
      document.documentElement.setAttribute('data-sidebar', sidebarState === 'collapsed' ? 'collapsed' : 'expanded');
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "./graph-model.mjs?v=routing-20260823-1": "./graph-model.mjs?v=stat-panel-20260831-1"
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css?v=individual-projections-20260901-1" />
  <link rel="stylesheet" href="./projection-selector.css?v=projection-selector-20260903-1" />
  <link rel="stylesheet" href="./graph-layout.css?v=mobile-20260831-1" />
  <style>
    html[data-sidebar="collapsed"] .app-shell {
      grid-template-columns: minmax(0, 1fr);
    }
    html[data-sidebar="collapsed"] .sidebar {
      display: none;
    }
    .topbar-heading {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #sidebarToggle {
      flex: 0 0 auto;
      min-width: 34px;
      padding-inline: 9px;
      font-size: 18px;
      line-height: 1;
    }
    @media (max-width: 900px) {
      html[data-sidebar="collapsed"] .app-shell {
        grid-template-columns: 1fr;
      }
      #sidebarToggle {
        min-width: 44px;
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <strong>SPELLWRIGHT</strong>
        <span>DESIGN DB</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <button class="ghost" id="exportBtn">Export JSON</button>
        <label class="ghost file-label">Import JSON<input id="importInput" type="file" accept="application/json" /></label>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="topbar-heading">
          <button class="ghost" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="사이드바 닫기" title="사이드바 닫기">☰</button>
          <h1 id="projectName"></h1>
        </div>
        <div class="topbar-actions">
          <span class="version-pill" id="version"></span>
          <button class="ghost" id="themeToggle" type="button">Theme</button>
          <button id="saveBtn">Save local draft</button>
        </div>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <dialog id="editorDialog">
    <form method="dialog" id="editorForm">
      <div class="dialog-head">
        <div>
          <span class="detail-kicker">SYSTEM DETAILS</span>
          <h2 id="editorTitle"></h2>
        </div>
        <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
      </div>

      <input type="hidden" id="editId" />

      <div class="editor-meta-grid">
        <label>상태<select id="editStatus"></select></label>
        <label>카테고리<input id="editCategory" /></label>
      </div>

      <label>미리보기 설명<textarea id="editDefinition" rows="3"></textarea></label>
      <label>상세 설명<textarea id="editDetails" rows="10"></textarea></label>

      <div id="editorExtra" class="editor-extra"></div>

      <label>마지막 변경 버전<input id="editVersion" /></label>

      <div class="dialog-actions">
        <button class="ghost" value="cancel">Cancel</button>
        <button type="submit" value="default" id="applyEdit">Apply</button>
      </div>
    </form>
  </dialog>

  <script src="./theory-extension.js?v=magic-theory-20260903-1"></script>
  <script type="module" src="./app.js?v=geometric-order-20260902-1"></script>
  <script type="module" src="./projection-selector.js?v=projection-selector-20260903-1"></script>
  <script type="module" src="./stats.js?v=stats-20260825-1"></script>
  <script type="module" src="./classes.js?v=classes-20260831-2"></script>
  <script type="module" src="./stat-tree-ui.js?v=ui-20260831-2"></script>
  <script>
    (() => {
      const button = document.getElementById('themeToggle');
      const getTheme = () => document.documentElement.getAttribute('data-theme') || 'dark';
      const updateLabel = () => {
        button.textContent = getTheme() === 'light' ? 'Dark' : 'Light';
      };
      button.addEventListener('click', () => {
        const next = getTheme() === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('spellwright-theme', next);
        updateLabel();
      });
      updateLabel();
    })();

    (() => {
      const button = document.getElementById('sidebarToggle');
      const root = document.documentElement;
      const isCollapsed = () => root.getAttribute('data-sidebar') === 'collapsed';
      const updateButton = () => {
        const expanded = !isCollapsed();
        const label = expanded ? '사이드바 닫기' : '사이드바 열기';
        button.setAttribute('aria-expanded', String(expanded));
        button.setAttribute('aria-label', label);
        button.title = label;
      };

      button.addEventListener('click', () => {
        const next = isCollapsed() ? 'expanded' : 'collapsed';
        root.setAttribute('data-sidebar', next);
        localStorage.setItem('spellwright-sidebar', next);
        updateButton();
      });

      updateButton();
    })();
  </script>
</body>
</html>
