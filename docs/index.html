<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spellwright 로그라이트 프로젝트의 Live Design Dashboard" />
  <title>Spellwright — Design Dashboard</title>
  <link rel="canonical" href="https://hix4123.github.io/spellwright/" />
  <script>
    (() => {
      const saved = localStorage.getItem('spellwright-theme');
      const preferred = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>SPELLWRIGHT</strong>
        <span>DESIGN DB</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <button class="ghost" id="exportBtn">Export JSON</button>
        <label class="ghost file-label">Import JSON<input id="importInput" type="file" accept="application/json" /></label>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <h1 id="projectName"></h1>
        <div class="topbar-actions">
          <span class="version-pill" id="version"></span>
          <button class="ghost" id="themeToggle" type="button">Theme</button>
          <button id="saveBtn">Save local draft</button>
        </div>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <dialog id="editorDialog">
    <form method="dialog" id="editorForm">
      <div class="dialog-head">
        <h2 id="editorTitle"></h2>
        <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
      </div>
      <input type="hidden" id="editId" />
      <label>상태<select id="editStatus"></select></label>
      <label>정의<textarea id="editDefinition" rows="6"></textarea></label>
      <label>카테고리<input id="editCategory" /></label>
      <label>마지막 변경 버전<input id="editVersion" /></label>
      <div class="dialog-actions">
        <button class="ghost" value="cancel">Cancel</button>
        <button type="submit" value="default" id="applyEdit">Apply</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
  <script>
    (() => {
      const button = document.getElementById('themeToggle');
      const updateLabel = () => {
        button.textContent = document.documentElement.dataset.theme === 'light' ? 'Dark' : 'Light';
      };
      button.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('spellwright-theme', next);
        updateLabel();
      });
      updateLabel();
    })();
  </script>
</body>
</html>
